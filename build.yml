name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given

      - name: Upload Geode file
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: "**/*.geode"
          if-no-files-found: error
